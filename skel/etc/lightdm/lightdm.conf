# KiniNi LightDM configuration.
#
# session-wrapper: kinini-session sets up XDG_RUNTIME_DIR and the
# locale for the session (there is no systemd/elogind to do it).
#
# the live iso adds an autologin block for the 'kiwi' user (mkiso.sh);
# kiwi-install strips it back from the installed system.

[LightDM]
session-wrapper=/usr/bin/kinini-session
# do not gate the seat on an active logind graphical session: sessions
# are not registered with elogind through PAM on every path (autologin),
# and a system without elogind at all must boot to the greeter anyway
logind-check-graphical=false

[Seat:*]
greeter-session=lightdm-gtk-greeter
user-session=xfce

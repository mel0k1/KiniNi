# zram-swap configuration (CachyOS-style defaults)
# See /usr/bin/zram-swap. Changes take effect on next boot, or
# immediately with: zram-swap stop && zram-swap start

# SIZE  swap size in MiB, or "auto" = min(RAM, 32768)
SIZE=auto

# ALGO  compression algorithm: zstd (best ratio), lz4 (fastest),
#       lzo-rle, deflate
ALGO=zstd

# PRIORITY  swap priority; zram must win over any disk swap
PRIORITY=100

# SWAPPINESS  vm.swappiness while zram is active (CachyOS: 150)
SWAPPINESS=150

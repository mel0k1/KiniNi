# sched_ext CPU scheduler configuration (CachyOS-style tuning)
# The 'scx' service (svctl enable scx) loads the BPF scheduler below
# under niinit supervision: if it crashes it is restarted automatically.
# Requires CONFIG_SCHED_CLASS_EXT (the KiniNi kernel has it; Void kernels
# do not). Manage at runtime with: kinini-scx status|list|use|on|off|top
# 'kinini-scx use <name> --now' switches the scheduler without a reboot.

# SCX_SCHEDULER  one of the schedulers shipped by the 'scx' package:
#   scx_lavd     latency-criticality aware dynamic priority (CachyOS
#                default; good for desktops and gaming)
#   scx_bpfland  interactive-first vruntime scheduler, general desktop
#   scx_flash    lightweight EDF, very low overhead (servers, VMs)
#   scx_p2dq     pick-two dispatch queues, simple and modern
#   scx_rusty    load-balancing hierarchical buckets
#   scx_layered  policy-driven hierarchical layers (advanced setups)
#   full list:   ls /usr/bin/scx_*  (after: kipki install scx)
SCX_SCHEDULER=scx_lavd

# SCX_FLAGS  extra command line flags passed to the scheduler
SCX_FLAGS=

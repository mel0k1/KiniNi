# KiniNi system tuning
# Ported from CachyOS usr/lib/sysctl.d/70-cachyos-settings.conf
# (https://github.com/CachyOS/CachyOS-Settings) and adapted for niinit:
# applied at boot by /etc/niinit/1 from /usr/lib/sysctl.d and /etc/sysctl.d.
#
# Defaults assume the KiniNi setup: zram swap (see zram-swap) preferred
# over disk swap, quiet console, desktop/laptop latency profile.

# With zram (compressed RAM) swap, swapping out anonymous pages is cheap:
# prefer it over reclaiming page cache (CachyOS uses 100, zram-swap raises
# it to 150 while zram is active).
vm.swappiness = 100

# Keep the VFS (dentry/inode) cache under memory pressure; do not set to 0
# (risk of OOM).
vm.vfs_cache_pressure = 50

# Cap dirty page writeout by absolute size instead of percentages: smoother
# IO on both slow and fast storage.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500

# Swap readahead granularity; 0 is optimal for compressed zram swap.
vm.page-cluster = 0

# Large address space per process (games, emulators, big JIT workloads).
vm.max_map_count = 2147483642

# The NMI watchdog costs performance and power; disable it.
kernel.nmi_watchdog = 0

# Hide kernel messages from the console (they still land in dmesg).
kernel.printk = 3 3 3 3

# Restrict kernel pointers in /proc; allow magic sysrq for recovery.
kernel.kptr_restrict = 2
kernel.sysrq = 1

# Raise file handle / inode cache limits.
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288

# Network: larger receive backlog and socket buffers, BBR congestion
# control with fair-queue pacing (modules loaded by /etc/niinit/1).
net.core.netdev_max_backlog = 4096
net.core.rmem_max = 4194304
net.core.wmem_max = 1048576
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

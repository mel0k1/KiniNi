name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build and smoke test
    runs-on: ubuntu-latest
    container: voidlinux/voidlinux
    steps:
      - name: install toolchain
        run: |
          mkdir -p /etc/xbps.d
          printf 'repository=https://repo-default.voidlinux.org/current\n' \
            > /etc/xbps.d/00-repository-main.conf
          xbps-install -y -Su xbps
          xbps-install -y -u
          xbps-install -y gcc make pkg-config libxbps-devel libarchive-devel \
            openssl-devel shellcheck git
      - name: clone
        run: |
          git init /src
          cd /src
          git remote add origin "https://github.com/${{ github.repository }}"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD
      - name: build
        run: make -C /src
      - name: lint scripts
        run: shellcheck /src/tools/mkrootfs.sh /src/tools/mkiso.sh \
          /src/tools/test-boot.sh /src/tools/kiwi-install /src/tools/mkkernel.sh \
          /src/skel/etc/niinit/1 /src/skel/etc/niinit/services-available/scx/run
      - name: smoke test supervisor
        run: /src/niinit/test-sv.sh

      - name: smoke test svdir
        run: |
          export PATH="/src/niinit/bin:$PATH"
          mkdir -p /tmp/svdirtest/services /tmp/svdirtest/available/foo
          printf '#!/bin/sh\nexec sleep 30\n' > /tmp/svdirtest/available/foo/run
          chmod +x /tmp/svdirtest/available/foo/run
          NIINIT_SVDIR=/tmp/svdirtest/services NIINIT_SVAVAIL=/tmp/svdirtest/available \
            svctl enable foo
          test -L /tmp/svdirtest/services/foo
          niinit-svdir /tmp/svdirtest/services &
          sleep 6
          test "$(cat /tmp/svdirtest/services/foo/stat)" = up
          NIINIT_SVDIR=/tmp/svdirtest/services NIINIT_SVAVAIL=/tmp/svdirtest/available \
            svctl disable foo
          sleep 7
          test ! -e /tmp/svdirtest/services/foo
          test ! -e /tmp/svdirtest/services/foo/stat

  rootfs:
    name: rootfs smoke test
    runs-on: ubuntu-latest
    container: voidlinux/voidlinux
    steps:
      - name: install toolchain
        run: |
          mkdir -p /etc/xbps.d
          printf 'repository=https://repo-default.voidlinux.org/current\n' \
            > /etc/xbps.d/00-repository-main.conf
          xbps-install -y -Su xbps
          xbps-install -y -u
          xbps-install -y gcc make pkg-config libxbps-devel libarchive-devel \
            openssl-devel git
      - name: clone
        run: |
          git init /src
          cd /src
          git remote add origin "https://github.com/${{ github.repository }}"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD
      - name: build
        run: make -C /src
      - name: build rootfs
        run: /src/tools/mkrootfs.sh /tmp/rootfs
      - name: verify rootfs
        run: |
          set -x
          test -x /tmp/rootfs/sbin/niinit
          test -L /tmp/rootfs/sbin/init
          test -x /tmp/rootfs/sbin/niinit-sv
          test -x /tmp/rootfs/sbin/niinit-svdir
          test -x /tmp/rootfs/usr/bin/kipki
          test -L /tmp/rootfs/usr/bin/reboot
          test -f /tmp/rootfs/usr/share/kinini/kiwi.txt
          test -f /tmp/rootfs/etc/xdg/fastfetch/config.jsonc
          grep -q 'PRETTY_NAME="KiniNi Linux' /tmp/rootfs/etc/os-release
          grep -q '^kinini$' /tmp/rootfs/etc/hostname
          test -x /tmp/rootfs/etc/niinit/1
          test -x /tmp/rootfs/etc/niinit/3
          test -x /tmp/rootfs/etc/niinit/services/getty-tty6/run
          test -x /tmp/rootfs/etc/niinit/services-available/sshd/run
          test ! -e /tmp/rootfs/etc/niinit/services/sshd
          test -x /tmp/rootfs/usr/bin/zram-swap
          test -f /tmp/rootfs/etc/kinini/zram.conf
          test -f /tmp/rootfs/usr/lib/sysctl.d/70-kinini-settings.conf
          test -f /tmp/rootfs/usr/lib/udev/rules.d/66-kinini-iosched.rules
          test -f /tmp/rootfs/usr/lib/modprobe.d/kinini-watchdog.conf
          test -f /tmp/rootfs/etc/security/limits.d/20-audio.conf
          test -x /tmp/rootfs/etc/niinit/services-available/dhcpcd/run
          test ! -e /tmp/rootfs/etc/niinit/services/dhcpcd
          test -x /tmp/rootfs/etc/niinit/services-available/scx/run
          test ! -e /tmp/rootfs/etc/niinit/services/scx
          test -f /tmp/rootfs/etc/kinini/scx.conf
          test -f /tmp/rootfs/etc/profile.d/10-locale.sh
          grep -q '^SCX_SCHEDULER=scx_lavd' /tmp/rootfs/etc/kinini/scx.conf
          grep -q 'sys/fs/bpf' /tmp/rootfs/etc/niinit/1
          grep -q 'crypttab' /tmp/rootfs/etc/niinit/1

  iso:
    name: iso build
    runs-on: ubuntu-latest
    container: voidlinux/voidlinux
    steps:
      - name: install toolchain
        run: |
          mkdir -p /etc/xbps.d
          printf 'repository=https://repo-default.voidlinux.org/current\n' \
            > /etc/xbps.d/00-repository-main.conf
          xbps-install -y -Su xbps
          xbps-install -y -u
          xbps-install -y gcc make pkg-config libxbps-devel libarchive-devel \
            openssl-devel git cpio xorriso syslinux zstd wget \
            mtools dosfstools grub grub-x86_64-efi edk2-ovmf qemu-img \
            flex bison bc pahole libelf-devel perl
          xbps-install -y qemu-system-amd64 || xbps-install -y qemu-system-x86_64
      - name: build static busybox
        run: |
          wget -q https://busybox.net/downloads/busybox-1.37.0.tar.bz2
          tar xf busybox-1.37.0.tar.bz2
          cd busybox-1.37.0
          make defconfig
          sed -i -e 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' \
                 -e 's/^CONFIG_TC=y/# CONFIG_TC is not set/' .config
          make -j"$(nproc)" >/dev/null
          echo "BUSYBOX=$PWD/busybox" >> "$GITHUB_ENV"
      - name: clone
        run: |
          git init /src
          cd /src
          git remote add origin "https://github.com/${{ github.repository }}"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD
      - name: build
        run: make -C /src
      - name: build rootfs
        run: |
          IGNORE_PKGS=linux /src/tools/mkrootfs.sh /tmp/rootfs \
            https://repo-default.voidlinux.org/current base-system linux6.12 \
            fastfetch syslinux dhcpcd dosfstools hdparm procps-ng \
            cryptsetup tzdata glibc-locales scx
      - name: build kinini kernel (sched_ext)
        timeout-minutes: 120
        run: |
          KVER=6.12.114
          wget -q "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$KVER.tar.xz"
          /src/tools/mkkernel.sh "linux-$KVER.tar.xz" /tmp/kernel-out
          install -Dm644 /tmp/kernel-out/vmlinuz-kinini /tmp/rootfs/usr/lib/kinini/vmlinuz-kinini
          install -Dm644 /tmp/kernel-out/kver /tmp/rootfs/usr/lib/kinini/kver
      - name: build iso
        run: /src/tools/mkiso.sh /tmp/rootfs /tmp/kinini.iso
      - name: verify iso
        run: |
          test -s /tmp/kinini.iso
          test "$(stat -c %s /tmp/kinini.iso)" -gt 50000000
      - name: boot test (bios, install to disk)
        timeout-minutes: 70
        run: |
          /src/tools/test-boot.sh /tmp/kinini.iso bios boot
          /src/tools/test-boot.sh /tmp/kinini.iso bios install /tmp/disk-bios.raw
          /src/tools/test-boot.sh /tmp/kinini.iso bios verify /tmp/disk-bios.raw
      - name: boot test (uefi, install to disk)
        timeout-minutes: 70
        run: |
          /src/tools/test-boot.sh /tmp/kinini.iso uefi boot
          /src/tools/test-boot.sh /tmp/kinini.iso uefi install /tmp/disk-uefi.raw
          /src/tools/test-boot.sh /tmp/kinini.iso uefi verify /tmp/disk-uefi.raw
      - name: boot test (uefi, LUKS2 + locale + scx)
        timeout-minutes: 70
        run: |
          /src/tools/test-boot.sh /tmp/kinini.iso uefi install /tmp/disk-luks.raw luks
          /src/tools/test-boot.sh /tmp/kinini.iso uefi verify /tmp/disk-luks.raw luks
      - name: upload iso
        uses: actions/upload-artifact@v4
        with:
          name: kinini-live-iso
          path: /tmp/kinini.iso

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build and smoke test
    runs-on: ubuntu-latest
    container: voidlinux/voidlinux
    steps:
      - name: install toolchain
        run: |
          mkdir -p /etc/xbps.d
          printf 'repository=https://repo-default.voidlinux.org/current\n' \
            > /etc/xbps.d/00-repository-main.conf
          xbps-install -y -Su xbps
          xbps-install -y -u
          xbps-install -y gcc make pkg-config libxbps-devel libarchive-devel \
            openssl-devel shellcheck git
      - name: clone
        run: |
          git init /src
          cd /src
          git remote add origin "https://github.com/${{ github.repository }}"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD
      - name: build
        run: make -C /src
      - name: lint scripts
        run: shellcheck /src/tools/mkrootfs.sh /src/tools/mkiso.sh
      - name: smoke test supervisor
        run: |
          mkdir -p /tmp/svtest/svc
          printf '#!/bin/sh\nexec sleep 30\n' > /tmp/svtest/svc/run
          chmod +x /tmp/svtest/svc/run
          PATH="/src/niinit/bin:$PATH" niinit-sv /tmp/svtest/svc &
          sleep 1
          test "$(cat /tmp/svtest/svc/stat)" = up
          NIINIT_SVDIR=/tmp/svtest /src/niinit/bin/svctl down svc
          sleep 1
          test "$(cat /tmp/svtest/svc/stat)" = down
          NIINIT_SVDIR=/tmp/svtest /src/niinit/bin/svctl up svc
          sleep 1
          test "$(cat /tmp/svtest/svc/stat)" = up

  rootfs:
    name: rootfs smoke test
    runs-on: ubuntu-latest
    container: voidlinux/voidlinux
    steps:
      - name: install toolchain
        run: |
          mkdir -p /etc/xbps.d
          printf 'repository=https://repo-default.voidlinux.org/current\n' \
            > /etc/xbps.d/00-repository-main.conf
          xbps-install -y -Su xbps
          xbps-install -y -u
          xbps-install -y gcc make pkg-config libxbps-devel libarchive-devel \
            openssl-devel git
      - name: clone
        run: |
          git init /src
          cd /src
          git remote add origin "https://github.com/${{ github.repository }}"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD
      - name: build
        run: make -C /src
      - name: build rootfs
        run: /src/tools/mkrootfs.sh /tmp/rootfs
      - name: verify rootfs
        run: |
          test -x /tmp/rootfs/sbin/niinit
          test -L /tmp/rootfs/sbin/init
          test -x /tmp/rootfs/sbin/niinit-sv
          test -x /tmp/rootfs/sbin/niinit-svdir
          test -x /tmp/rootfs/usr/bin/kipki
          test -L /tmp/rootfs/usr/bin/reboot
          test -f /tmp/rootfs/usr/share/kinini/kiwi.txt
          test -f /tmp/rootfs/etc/xdg/fastfetch/config.jsonc
          grep -q 'PRETTY_NAME="KiniNi Linux' /tmp/rootfs/etc/os-release
          grep -q '^kinini$' /tmp/rootfs/etc/hostname
          test -x /tmp/rootfs/etc/niinit/1
          test -x /tmp/rootfs/etc/niinit/3
          test -x /tmp/rootfs/etc/niinit/services/getty-tty6/run
          test -x /tmp/rootfs/etc/niinit/services-available/sshd/run
          test ! -e /tmp/rootfs/etc/niinit/services/sshd

  iso:
    name: iso build
    runs-on: ubuntu-latest
    container: voidlinux/voidlinux
    steps:
      - name: install toolchain
        run: |
          mkdir -p /etc/xbps.d
          printf 'repository=https://repo-default.voidlinux.org/current\n' \
            > /etc/xbps.d/00-repository-main.conf
          xbps-install -y -Su xbps
          xbps-install -y -u
          xbps-install -y gcc make pkg-config libxbps-devel libarchive-devel \
            openssl-devel git cpio gzip xorriso syslinux findutils zstd wget
      - name: build static busybox
        run: |
          wget -q https://busybox.net/downloads/busybox-1.37.0.tar.bz2
          tar xf busybox-1.37.0.tar.bz2
          cd busybox-1.37.0
          make defconfig
          sed -i -e 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' \
                 -e 's/^CONFIG_TC=y/# CONFIG_TC is not set/' .config
          make -j"$(nproc)" >/dev/null
          echo "BUSYBOX=$PWD/busybox" >> "$GITHUB_ENV"
      - name: clone
        run: |
          git init /src
          cd /src
          git remote add origin "https://github.com/${{ github.repository }}"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD
      - name: build
        run: make -C /src
      - name: build rootfs
        run: |
          IGNORE_PKGS=linux /src/tools/mkrootfs.sh /tmp/rootfs \
            https://repo-default.voidlinux.org/current base-system linux6.12 fastfetch
      - name: build iso
        run: /src/tools/mkiso.sh /tmp/rootfs /tmp/kinini.iso
      - name: verify iso
        run: |
          test -s /tmp/kinini.iso
          test "$(stat -c %s /tmp/kinini.iso)" -gt 50000000
      - name: upload iso
        uses: actions/upload-artifact@v4
        with:
          name: kinini-live-iso
          path: /tmp/kinini.iso
